[pytest]
# 测试根目录：所有测试集中在此，根目录不再放置 test_*.py
testpaths = tests
# 让 tests/ 下各层都能 import api / crawlers / analysis 等后端模块
pythonpath = .
# 排除历史遗留测试：它们记录的是上一代的验证方式，不守护当前契约
# （依赖已变更的接口、缺 pytest-asyncio 配置、多为无断言的连通性检查）。
# 文件保留在 tests/legacy/ 供追溯，需要时用 --override-ini 单独启用。
addopts = -q --tb=short --ignore=tests/legacy
# 忽略归档与非测试目录
norecursedirs = scripts/archive venv .local data
